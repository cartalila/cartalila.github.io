*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:10px}
img{display:block;max-width:100%}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.flor{color:var(--gold)}
.app{max-width:680px;margin:0 auto;padding:0 18px calc(110px + env(safe-area-inset-bottom))}

/* Arco: el marco de la carta impresa, usado como ventana de la casa */
.arch{position:relative;overflow:hidden;background:var(--lav);border-radius:50% 50% 12px 12px / 40% 40% 12px 12px;isolation:isolate}
.arch.tall{border-radius:50% 50% 12px 12px / 37.5% 37.5% 12px 12px}
.arch img{width:100%;height:100%;object-fit:cover}
.arch.noimg::after{content:"";position:absolute;inset:28% 26%;background:var(--gold);opacity:.55;-webkit-mask:var(--flor-mask) center/contain no-repeat;mask:var(--flor-mask) center/contain no-repeat}
.frame{box-shadow:0 0 0 4px var(--bg),0 0 0 5px var(--line2)}

/* ---------- Portada: la fachada ---------- */
.topbar{display:flex;align-items:center;gap:4px;padding:14px 0 0}
.topbar .sp{flex:1}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--gold-ink);position:relative}
.icon-btn:hover{background:var(--lav)}
.icon-btn.on{background:var(--btn);color:var(--btn-ink)}
.mesa-chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border:1px solid var(--line2);border-radius:99px;font:400 13px/1 var(--sans);color:var(--muted)}
.mesa-chip b{font-weight:500;color:var(--ink);font-size:14px}
.hero{text-align:center;padding:2px 0 8px}
.hero-logo{width:118px;margin:0 auto;color:var(--gold)}
.hero-logo svg{width:100%;height:auto;display:block}
.facade{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:26px auto 0;position:relative}
.facade::after{content:"";position:absolute;left:8%;right:8%;bottom:-10px;height:1px;background:var(--line2)}
.win{width:94px;aspect-ratio:3/4.3;border-radius:50% 50% 8px 8px / 35% 35% 8px 8px}
.win.mid{width:124px}
.win img{position:absolute;inset:0;opacity:0;animation:ventana 15s infinite}
.win img:first-child{opacity:1}
.win img:nth-child(1){animation-delay:var(--d0)}
.win img:nth-child(2){animation-delay:var(--d1)}
.win img:nth-child(3){animation-delay:var(--d2)}
@keyframes ventana{0%{opacity:0;transform:scale(1.06)}4%{opacity:1}30%{opacity:1}36%{opacity:0;transform:scale(1)}100%{opacity:0}}
.lema{font:italic 500 22px/1.25 var(--serif);color:var(--muted);margin:26px auto 0;max-width:330px}
.estado{display:inline-flex;align-items:center;gap:8px;margin:12px 0 0;font:400 13.5px/1.2 var(--sans);color:var(--muted)}
.estado .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.estado.cerrado .dot{background:var(--warn)}

/* ---------- Historias ---------- */
.stories{display:flex;gap:14px;overflow-x:auto;padding:22px 18px 6px;margin:0 -18px;scrollbar-width:none;scroll-snap-type:x proximity}
.stories::-webkit-scrollbar{display:none}
.st-b{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:8px;scroll-snap-align:start}
.st-b .arch{width:62px;height:76px;box-shadow:0 0 0 2.5px var(--bg),0 0 0 4px var(--line2)}
.st-b.new .arch{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--gold)}
.st-b .lbl{font:400 12.5px/1.2 var(--sans);color:var(--ink);text-align:center;max-width:76px}
.st-b.surprise .arch{background:var(--btn);display:grid;place-items:center;color:var(--btn-ink)}
.st-b.surprise .arch svg{width:26px;height:26px}

/* ---------- Navegación ---------- */
.nav{position:sticky;top:0;z-index:20;margin:14px -18px 0;padding:0 8px 0 18px;background:var(--bg);background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:saturate(1.3) blur(14px);backdrop-filter:saturate(1.3) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s,box-shadow .2s}
.nav.stuck{border-bottom-color:var(--line);box-shadow:0 8px 20px -16px rgba(0,0,0,.35)}
.nav-row{display:flex;align-items:center;gap:2px;min-height:56px}
.tabs{flex:1;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent);mask-image:linear-gradient(90deg,#000 86%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:17px 11px 15px;font:500 14.5px/1 var(--sans);color:var(--muted);position:relative;white-space:nowrap}
.tab::after{content:"";position:absolute;left:11px;right:11px;bottom:9px;height:2px;border-radius:2px;background:var(--gold);transform:scaleX(0);transition:transform .25s}
.tab.on{color:var(--ink)}
.tab.on::after{transform:scaleX(1)}
.nav .icon-btn{width:40px;height:40px}
.badge{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--btn);color:var(--btn-ink);font:500 10.5px/17px var(--sans);text-align:center}
.search-row{display:none;align-items:center;gap:8px;min-height:56px;padding-right:8px}
.nav.searching .nav-row{display:none}
.nav.searching .search-row{display:flex}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:99px;padding:0 14px;height:44px;color:var(--gold-ink)}
.search-box input{flex:1;min-width:0;border:0;background:none;font:400 16px var(--sans);color:var(--ink);outline:none}
.search-box input::placeholder{color:var(--muted)}
.link-btn{font:500 14px var(--sans);color:var(--gold-ink);padding:10px 6px}
.chips-active{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chips-active:empty{display:none}
.chip-x{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px 0 13px;border-radius:99px;background:var(--lav);font:400 13px/1 var(--sans)}
.chip-x .ico{width:14px;height:14px}
.result-info{font:400 13.5px var(--sans);color:var(--muted);padding:14px 0 0}

/* ---------- Secciones ---------- */
.sec{padding:34px 0 8px}
.sec.band{background:var(--lav);margin:30px -18px 0;padding:34px 18px 34px}
.sec.band .frame{box-shadow:0 0 0 4px var(--lav),0 0 0 5px var(--line2)}
.sec-head{text-align:center;padding:4px 0 2px}
.sec-head .flor{width:28px;height:28px}
.sec-head h2{font:600 40px/1 var(--serif);margin:10px 0 0}
.sec-head p{margin:10px auto 0;font:italic 500 18px/1.3 var(--serif);color:var(--muted);max-width:340px}
.cat{padding-top:30px}
.cat-title{display:flex;align-items:center;gap:10px;margin:0 0 18px;padding-bottom:10px;border-bottom:1px solid var(--line2);font:500 12.5px/1.2 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold-ink)}
.cat-title .flor{width:16px;height:16px}
.cat-sub{margin:-8px 0 16px;font:italic 500 17px/1.2 var(--serif);color:var(--muted)}
.legal{margin:30px 0 0;text-align:center;font:400 12px/1.5 var(--sans);color:var(--muted)}
.sec.band .legal,.sec.band .cat-sub{color:var(--muted-lav)}

/* ---------- Vista fotos: tarjetas con arco ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px 16px}
.card{position:relative;cursor:pointer;min-width:0}
.card .arch{aspect-ratio:4/5;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.card.drink .arch{aspect-ratio:3/4}
.card:active .arch{transform:scale(.98)}
.card .arch img{transition:transform .6s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){.card:hover .arch img{transform:scale(1.05)}}
.c-ph{position:relative}
.c-ph .add{position:absolute;right:8px;bottom:8px;top:auto;transform:none;margin:0;box-shadow:var(--shadow-s)}
.c-av{position:absolute;left:8px;bottom:10px;max-width:calc(100% - 64px);padding:4px 9px;border-radius:99px;background:var(--surface);font:500 11px/1.25 var(--sans);color:var(--warn);box-shadow:var(--shadow-s)}
.c-av.hoy{color:var(--ok)}
.c-av.pedido{color:var(--gold-ink)}
.c-name{margin:14px 0 0;font:600 19.5px/1.15 var(--serif);text-wrap:balance}
.c-name button{text-align:left}
.c-desc{margin:5px 0 0;font:400 13px/1.45 var(--sans);color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sec.band .c-desc{color:var(--muted-lav)}
.c-foot{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:7px}
.c-price{font:500 15px/1 var(--sans)}
.c-tag{font:500 10.5px/1.2 var(--sans);color:var(--gold-ink);letter-spacing:.06em}
.card.wide{grid-column:1/-1;display:grid;grid-template-columns:min(44%,280px) 1fr;gap:18px;align-items:center}
.card.wide .c-name{margin-top:0;font-size:23px}
.card.wide .c-desc{-webkit-line-clamp:4;font-size:13.5px}
@media (max-width:699px){.card.wide-m{grid-column:1/-1;display:grid;grid-template-columns:44% 1fr;gap:18px;align-items:center}.card.wide-m .c-name{margin-top:0;font-size:23px}.card.wide-m .c-desc{-webkit-line-clamp:4;font-size:13.5px}}
.card.off .arch img{filter:grayscale(.75);opacity:.6}
.card.off .c-name,.card.off .c-price{opacity:.55}

@keyframes pop{40%{transform:scale(1.2)}}

/* Destacado */
.feature{display:grid;grid-template-columns:1fr;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line2);padding:30px 22px 26px;position:relative;cursor:pointer;text-align:center}
.feature .ribbon{position:absolute;top:-10px;left:0;right:0;display:flex;justify-content:center}
.feature .ribbon span{padding:0 14px;background:linear-gradient(var(--bg) 50%,var(--surface) 50%);font:500 11px/20px var(--sans);letter-spacing:.36em;text-transform:uppercase;color:var(--gold-ink)}
.sec.band .feature .ribbon span{background:linear-gradient(var(--lav) 50%,var(--surface) 50%)}
.feature .arch{width:min(62%,230px);margin:0 auto;aspect-ratio:4/5}
.feature.drink .arch{aspect-ratio:3/4}
.feature .frame{box-shadow:0 0 0 4px var(--surface),0 0 0 5px var(--line2)!important}
.f-name{margin:0;font:600 30px/1.1 var(--serif);text-wrap:balance}
.f-desc{margin:10px auto 0;max-width:460px;color:var(--muted);font-size:14.5px}
.f-meta{margin:10px 0 0;font:500 10.5px/1.6 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.f-foot{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px}
.f-foot .c-price{font-size:19px;letter-spacing:.04em;color:var(--gold-ink)}
@media (min-width:600px){.feature.nophoto{grid-template-columns:1fr!important;text-align:center!important}.feature.nophoto .f-foot{justify-content:center!important}.feature.nophoto .f-desc{margin-left:auto!important}.feature{grid-template-columns:240px 1fr;text-align:left;padding:34px 30px}.feature .arch{width:100%}.f-foot{justify-content:flex-start}.f-desc{margin-left:0}}

/* Especiales de la semana */
.specials{display:flex;gap:14px;overflow-x:auto;margin:0 -18px;padding:4px 18px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.specials::-webkit-scrollbar{display:none}
.special{flex:0 0 min(84%,340px);scroll-snap-align:center;background:var(--lav);padding:18px 16px 16px;border:1px solid transparent;display:flex;flex-direction:column}
.special.is-today{background:var(--surface);border-color:var(--gold);box-shadow:var(--shadow-s)}
.special-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.day-badge{background:var(--gold-ink);color:#fff;padding:5px 10px;font:500 10.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase}
[data-theme=dark] .day-badge{background:var(--gold);color:#1c1620}
.today-pill{font:500 12px/1 var(--sans);color:var(--ok)}
.special-title{margin:12px 0 14px;font:600 24px/1.1 var(--serif)}
.special .grid{gap:20px 12px}
.special .c-name{font-size:17.5px}
.special-foot{margin:auto 0 0;padding-top:14px;font:italic 500 15.5px/1.3 var(--serif);color:var(--gold-ink);text-align:center}

/* ---------- Vista lista (como la carta impresa) ---------- */
.list .row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .row.has-photo{grid-template-columns:64px 1fr auto}
.list .row:last-child{border-bottom:0}
.list .row .arch{width:64px;height:78px}
.list .row.drink .arch{height:84px}
.r-head{display:flex;align-items:baseline;gap:8px}
.r-name{margin:0;font:600 20px/1.15 var(--serif);min-width:0;text-wrap:balance}
.r-name button{text-align:left}
.leader{flex:1;min-width:14px;border-bottom:1.5px dotted var(--line2);transform:translateY(-5px)}
.r-price{flex:none;font:500 15px/1 var(--sans);white-space:nowrap}
.r-desc{margin:5px 0 0;color:var(--muted);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r-meta{margin-top:6px;font:500 10.5px/1.5 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink)}
.r-meta .w{color:var(--warn)}
.list .row .add{align-self:center}
.list .row.off .r-name,.list .row.off .r-price{opacity:.55}

.empty{text-align:center;padding:50px 10px;color:var(--muted)}
.empty .flor{width:44px;height:44px;opacity:.6}
.empty h3{font:600 24px var(--serif);color:var(--ink);margin:12px 0 6px}

/* ---------- Pie ---------- */
.foot{text-align:center;padding:50px 6px 10px;color:var(--muted)}
.foot .logo-s{width:96px;margin:0 auto;color:var(--gold)}
.foot .logo-s svg{width:100%;height:auto;display:block}
.gracias{font:italic 500 21px/1.3 var(--serif);margin:18px 0 0}
.foot p{font-size:12.5px;line-height:1.55;margin:12px auto 0;max-width:520px}
.foot-actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.pill-btn{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:99px;border:1px solid var(--line2);font:500 13.5px var(--sans);color:var(--gold-ink)}
.pill-btn .ico{width:18px;height:18px}
.frescura{display:inline-flex;align-items:center;gap:7px;margin-top:20px;font:400 12px var(--sans);color:var(--muted)}
.frescura .dot{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.frescura.vivo .dot{background:var(--ok)}

/* ---------- Hojas ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;transition:opacity .3s;pointer-events:none}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:620px;margin:0 auto;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:var(--shadow);transform:translateY(105%);transition:transform .42s cubic-bezier(.2,.8,.2,1);visibility:hidden;overflow:hidden}
.sheet.show{transform:none;visibility:visible}
.sheet:focus{outline:none}
.sheet-grab{position:absolute;top:0;left:0;right:0;z-index:2;height:22px;display:grid;place-items:center;touch-action:none}
.sheet-grab::before{content:"";width:42px;height:5px;border-radius:3px;background:var(--line2)}
.sheet-close{position:absolute;top:14px;right:14px;z-index:3;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:26px 22px 22px}
.sheet[data-kind=detail] .sheet-body{padding-top:0}
.sheet-foot{flex:none;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.sh-title{font:600 30px/1.1 var(--serif);margin:6px 0 4px}
.sh-sub{color:var(--muted);font-size:14px;margin:0}

/* Detalle */
.d-stage{position:relative;margin:0 -22px;padding:42px 0 26px;background:var(--lav);display:flex;align-items:center;justify-content:center;gap:10px;overflow:hidden;touch-action:pan-y}
.d-stage::before{content:"";position:absolute;right:-90px;bottom:-110px;width:300px;height:300px;background:var(--gold);opacity:.08;-webkit-mask:var(--flor-mask) center/contain no-repeat;mask:var(--flor-mask) center/contain no-repeat}
.d-win{width:min(64%,300px);aspect-ratio:4/5;box-shadow:0 0 0 5px var(--lav),0 0 0 6px var(--line2),var(--shadow)}
.d-win.tall{aspect-ratio:3/4}
.d-win img{animation:dIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes dIn{from{opacity:0;transform:scale(1.05)}}
.d-nav{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--gold-ink);box-shadow:var(--shadow-s)}
.d-nav:disabled{opacity:0}
.d-ai{position:absolute;bottom:8px;left:0;right:0;text-align:center;font:400 11px var(--sans);color:var(--muted-lav)}
.d-pos{position:absolute;top:16px;left:18px;font:400 12px var(--sans);color:var(--muted-lav)}
.d-cat{margin:20px 0 0;font:500 11.5px/1 var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--gold-ink)}
.d-name{font:600 32px/1.08 var(--serif);margin:8px 0 0;text-wrap:balance}
.d-price{font:500 19px var(--sans);margin:8px 0 0}
.d-desc{color:var(--muted);margin:12px 0 0;font-size:15px}
.d-box{margin:16px 0 0;padding:12px 14px;border-radius:14px;background:var(--bg);font-size:13.5px;color:var(--muted)}
.d-box b{color:var(--ink);font-weight:500}
.d-box.warn{background:#f6e7df;color:var(--ink)}
.d-box.ok{background:#e7f0e3;color:var(--ink)}
[data-theme=dark] .d-box.warn{background:#3a2a26}
[data-theme=dark] .d-box.ok{background:#25331f}
.alg-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.alg{padding:5px 11px;border-radius:99px;background:var(--surface);border:1px solid var(--line2);font:400 12.5px var(--sans);color:var(--ink)}
.meta-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tag{display:inline-block;padding:4px 10px;border:1px solid var(--line2);border-radius:99px;font:500 11px/1.3 var(--sans);letter-spacing:.06em;color:var(--gold-ink)}
.opt-group{border:0;padding:0;margin:22px 0 0}
.opt-group legend{font:500 13px/1 var(--sans);color:var(--ink);margin-bottom:10px;padding:0}
.opt-group legend small{color:var(--muted);font-weight:400}
.opt-wrap{display:flex;flex-wrap:wrap;gap:8px}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line2);font:400 14.5px var(--sans);cursor:pointer;transition:all .15s}
.opt input:checked+span{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.opt input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.opt small{opacity:.8;font-size:12.5px}
.pair{margin:26px 0 0}
.pair h4{margin:0 0 12px;font:italic 500 21px/1.2 var(--serif)}
.pair-row{display:flex;gap:12px;overflow-x:auto;margin:0 -22px;padding:0 22px 4px;scrollbar-width:none}
.pair-row::-webkit-scrollbar{display:none}
.pair-card{flex:0 0 112px;text-align:left;cursor:pointer}
.pair-card .arch{width:100%;aspect-ratio:4/5}
.pair-card b{display:block;margin-top:8px;font:600 15.5px/1.15 var(--serif)}
.pair-card span{display:block;font:500 12.5px var(--sans);color:var(--gold-ink);margin-top:2px}
.foot-row{display:flex;gap:12px;align-items:center}
.btn{flex:1;height:54px;border-radius:99px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font:500 15.5px var(--sans);padding:0 18px}
.btn-primary{background:var(--btn);color:var(--btn-ink)}
.btn-primary:disabled{opacity:.45}
.btn-ghost{border:1px solid var(--line2);color:var(--ink)}
.btn-wa{background:#177a42;color:#fff}
.btn .ico{width:20px;height:20px}

/* Filtros */
.f-sec{margin:20px 0 0}
.f-sec h4{margin:0 0 10px;font:500 13px/1 var(--sans);color:var(--ink)}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px}
.fchip{min-height:44px;padding:0 16px;border-radius:99px;border:1px solid var(--line2);font:400 14.5px var(--sans)}
.fchip[aria-pressed=true]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.row-switch{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:20px}
.row-switch b{display:block;font-weight:500}
.row-switch small{color:var(--muted);font-size:13px}

/* Información */
.info-list{list-style:none;margin:16px 0 0;padding:0}
.info-list li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.info-list .ico{color:var(--gold-ink);margin-top:2px}
.info-list b{display:block;font-weight:500}
.info-list small{color:var(--muted);font-size:13.5px;display:block}
.info-list a{color:var(--gold-ink)}
.hor{width:100%;border-collapse:collapse;margin-top:4px;font-size:13.5px;color:var(--muted)}
.hor td{padding:2px 0}
.hor td:last-child{text-align:right}
.hor tr.today td{color:var(--ink);font-weight:500}
.copy-btn{margin-left:auto;align-self:center;display:inline-flex;gap:6px;align-items:center;padding:8px 12px;border-radius:99px;border:1px solid var(--line2);font:500 13px var(--sans);color:var(--gold-ink);flex:none}
.historia{font:italic 500 19px/1.45 var(--serif);color:var(--muted);margin:14px 0 0;text-align:center}

/* ---------- Historias a pantalla completa ---------- */
.story{position:fixed;inset:0;z-index:65;background:#140f17;color:#fff;display:none;user-select:none;-webkit-user-select:none}
.story.show{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.story-in{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden}
.st-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.st-img.noimg{background:#2b2232}
.st-img.noimg::after{content:"";position:absolute;inset:32% 30%;background:#c9a46c;opacity:.5;-webkit-mask:var(--flor-mask) center/contain no-repeat;mask:var(--flor-mask) center/contain no-repeat}
.st-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,15,23,.55) 0%,rgba(20,15,23,0) 22%,rgba(20,15,23,0) 45%,rgba(20,15,23,.88) 78%,rgba(20,15,23,.96) 100%)}
.st-bars{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:4px;z-index:3}
.st-bars i{flex:1;height:2.5px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.st-bars i b{display:block;height:100%;width:0;background:#fff}
.st-top{position:absolute;top:calc(22px + env(safe-area-inset-top));left:14px;right:8px;z-index:3;display:flex;align-items:center;gap:10px}
.st-top .flor{width:30px;height:30px;color:#c9a46c}
.st-top span{flex:1;font:500 14px var(--sans)}
.st-top button{width:44px;height:44px;display:grid;place-items:center;color:#fff}
.st-tap{position:absolute;top:80px;bottom:200px;z-index:2;width:35%}
.st-tap.l{left:0}.st-tap.r{right:0;width:65%}
.st-info{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:0 22px calc(26px + env(safe-area-inset-bottom))}
.st-k{font:italic 500 19px/1.2 var(--serif);color:#e2c48f;margin:0}
.st-info h3{font:600 38px/1.05 var(--serif);margin:6px 0 0;text-wrap:balance}
.st-info p{margin:10px 0 0;color:rgba(255,255,255,.82);font-size:14.5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.st-act{display:flex;align-items:center;gap:10px;margin-top:18px}
.st-act .p{font:500 20px var(--sans);margin-right:auto}
.st-act button{height:48px;padding:0 20px;border-radius:99px;font:500 15px var(--sans);background:#c9a46c;color:#1c1620;display:inline-flex;align-items:center;gap:8px}
.st-act button.g{background:rgba(255,255,255,.14);color:#fff}
.st-act .ico{width:18px;height:18px}
.combo{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:90px 22px 260px;gap:14px;background:#2b2232}
.combo-row{display:flex;gap:12px;justify-content:center;width:100%}
.combo-row .arch{width:30%;max-width:130px;aspect-ratio:4/5;background:#352b3d;box-shadow:0 0 0 3px #2b2232,0 0 0 4px #c9a46c}
.combo-names{text-align:center;font:500 14px/1.5 var(--sans);color:rgba(255,255,255,.85)}

/* Toast y carga */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:70;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:all .3s;background:var(--ink);color:var(--bg);padding:12px 16px 12px 18px;border-radius:99px;display:flex;align-items:center;gap:14px;font:400 14px var(--sans);box-shadow:var(--shadow);max-width:calc(100vw - 28px);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast button{font-weight:500;color:#e2c48f;flex:none}
[data-theme=dark] .toast button{color:#7f6136}
.loader{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;transition:opacity .4s}
.loader.hide{opacity:0;pointer-events:none}
.loader svg{width:64px;height:64px;color:var(--gold);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.88) rotate(18deg);opacity:.6}}

}

  .sheet{bottom:20px;border-radius:28px;max-height:90vh}
}

<script>
(function(){

};
var FLOR = '<svg class="flor" viewBox="0 0 1185 1129" aria-hidden="true"><use href="#flor"/></svg>';

/* =================== alérgenos y días =================== */
var ALG = {
  'gluten':{label:'Gluten', sin:'Sin gluten'}, 'lacteos':{label:'Lácteos', sin:'Sin lácteos'},
  'huevo':{label:'Huevo', sin:'Sin huevo'}, 'frutos-secos':{label:'Frutos secos', sin:'Sin frutos secos'},
  'mostaza':{label:'Mostaza', sin:'Sin mostaza'}, 'pescado':{label:'Pescado', sin:'Sin pescado'},
  'alcohol':{label:'Alcohol', sin:'Sin alcohol'}
};
var DIAS = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
var DIA_L = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
var DIA_PL = ['domingos','lunes','martes','miércoles','jueves','viernes','sábados'];
function diaIdx(t){ t = norm(t).slice(0, 3); if (t.length < 3) return -1; for (var i = 0; i < 7; i++) if (DIAS[i].indexOf(t) === 0) return i; return -1; }
function parseDias(s){
  s = norm(s); if (!s || /todos|diario|toda la semana/.test(s)) return null;
  var set = {};
  if (/fin(es)? de semana/.test(s)) { set[6] = 1; set[0] = 1; s = s.replace(/fin(es)? de semana/g, ' '); }
  s = s.replace(/([a-z]+)\s+a\s+([a-z]+)/g, function(m, a, b){
    var i = diaIdx(a), j = diaIdx(b); if (i < 0 || j < 0) return m;
    for (var k = i, n = 0; n < 7; n++){ set[k] = 1; if (k === j) break; k = (k + 1) % 7; } return ' ';
  });
  s.split(/[^a-z]+/).forEach(function(t){ var i = diaIdx(t); if (i >= 0) set[i] = 1; });
  var arr = Object.keys(set).map(Number).sort(function(a, b){ return ((a + 6) % 7) - ((b + 6) % 7); });
  return arr.length ? arr : null;
}
function joinY(a){ return a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' y ' + a[a.length - 1]; }
function diasCorto(d){ return joinY(d.map(function(i){ return DIA_L[i]; })); }
function diasPlural(d){ return 'los ' + joinY(d.map(function(i){ return DIA_PL[i]; })); }
function nowParts(){
  var d = new Date(), tz = CFG.zonaHoraria || 'America/Bogota', dow = d.getDay(), mins = d.getHours() * 60 + d.getMinutes();
  try {
    var p = new Intl.DateTimeFormat('en-US', {timeZone: tz, weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false}).formatToParts(d);
    var g = function(t){ for (var i = 0; i < p.length; i++) if (p[i].type === t) return p[i].value; };
    dow = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday'));
    mins = (parseInt(g('hour'), 10) % 24) * 60 + parseInt(g('minute'), 10);
  } catch(e){}
  var forced = diaIdx(params.get('dia') || '');
  if (forced >= 0) dow = forced;
  return {dow: dow, mins: mins};
}
var NOW = nowParts();

/* =================== datos =================== */
var state = {items: [], byId: {}, sections: [], rowsSig: '', q: '', excl: [], soloDisp: false, source: 'local', checkedAt: 0, mesa: '', order: null, view: 'fotos'};

function parseContiene(s){
  return String(s || '').split(/[,·;]/).map(function(x){ return x.trim(); }).filter(Boolean).map(function(x){
    var m = x.match(/^([^(]+?)\s*(?:\((.+)\))?$/) || [x, x, ''];
    var code = slug(m[1]); return {code: code, label: ALG[code] ? ALG[code].label : m[1].trim(), cond: (m[2] || '').trim()};
  });
}
function parseOpciones(s){
  return String(s || '').split(';').map(function(g){ return g.trim(); }).filter(Boolean).map(function(g){
    var name = 'Opción', rest = g, i = g.indexOf(':');
    if (i > 0){ name = g.slice(0, i).trim(); rest = g.slice(i + 1); }
    var choices = rest.split('|').map(function(c){ return c.trim(); }).filter(Boolean).map(function(c){
      var m = c.match(/^(.*?)\s*\+\s*\$?\s*([\d.,]+)\s*$/);
      return m ? {label: m[1].trim(), price: toInt(m[2]) || 0} : {label: c, price: 0};
    });
    return {name: name, type: choices.length > 1 ? 'radio' : 'check', choices: choices};
  }).filter(function(g){ return g.choices.length; });
}
function fotoDe(foto, drink){
  if (!foto) return null;
  if (/^(https?:)?\/\//.test(foto) || foto.indexOf('/') >= 0) return {t: foto, m: foto, f: foto};
  if (/\.(jpe?g|png|webp|gif|avif)$/i.test(foto)) return {t: 'img/' + foto, m: 'img/' + foto, f: 'img/' + foto};
  return {t: 'img/' + foto + '-t.webp', m: 'img/' + foto + '-m.webp', f: 'img/' + foto + '.webp'};
}
function normalize(rows){
  var out = [], ids = {};
  (rows || []).forEach(function(r, i){
    var g = function(k){ var v = r[k]; return v == null ? '' : String(v).trim(); };
    var nombre = g('nombre'); if (!nombre) return;
    var disp = norm(g('disponible'));
    if (/^(oculto|ocultar|oculta)$/.test(disp)) return;
    var seccion = g('seccion') || 'Carta', categoria = g('categoria') || 'Otros';
    var id = slug(categoria + '-' + nombre) || ('p' + i); while (ids[id]) id += '-2'; ids[id] = 1;
    var precio = toInt(r.precio), drink = /bebida|bar|coctel|trago/.test(norm(seccion));
    var it = {
      id: id, seccion: seccion, categoria: categoria, nombre: nombre, descripcion: g('descripcion'),
      precio: isFinite(precio) ? precio : null,
      contiene: parseContiene(g('contiene')),
      etiquetas: g('etiquetas').split(',').map(function(x){ return x.trim(); }).filter(Boolean),
      opciones: parseOpciones(g('opciones')),
      foto: fotoDe(g('foto'), drink),
      disponible: !/^(no|agotado|agotada|false|0|n)$/.test(disp),
      dias: parseDias(g('dias')), otros: /pedido/.test(norm(g('otros_dias'))) ? 'pedido' : 'no',
      grupo: g('grupo'), nota: g('nota'), destacado: /^(si|x|true|1)$/.test(norm(g('destacado'))),
      combina: g('combina'), drink: drink
    };
    it._q = norm([nombre, it.descripcion, categoria, seccion, it.etiquetas.join(' '), it.grupo].join(' '));
    out.push(it);
  });
  return out;
}
function setItems(rows){
  var items = normalize(rows);
  if (items.length < 3) return false;
  state.items = items; state.byId = {}; state.sections = [];
  var secMap = {};
  items.forEach(function(it){
    state.byId[it.id] = it;
    var s = secMap[it.seccion];
    if (!s){ s = secMap[it.seccion] = {name: it.seccion, id: 'sec-' + slug(it.seccion), cats: [], catMap: {}}; state.sections.push(s); }
    var c = s.catMap[it.categoria];
    if (!c){ c = s.catMap[it.categoria] = {name: it.categoria, id: 'cat-' + slug(it.seccion + '-' + it.categoria), items: []}; s.cats.push(c); }
    c.items.push(it); it._cat = c;
  });
  return true;
}
function avail(it){
  if (!it.disponible) return {ok: false, kind: 'agotado', label: 'Agotado por hoy', long: 'Se nos agotó por hoy. ¡Vuelve pronto!'};
  if (it.dias){
    if (it.dias.indexOf(NOW.dow) >= 0) return {ok: true, kind: 'hoy', label: 'Hoy'};
    if (it.otros === 'pedido') return {ok: true, kind: 'pedido', label: 'Bajo pedido', long: 'Hoy no es su día (' + diasCorto(it.dias).toLowerCase() + '). Se prepara bajo pedido: confírmalo con tu mesero.'};
    return {ok: false, kind: 'dia', label: 'Solo ' + diasPlural(it.dias), long: 'Disponible solo ' + diasPlural(it.dias) + '.'};
  }
  return {ok: true, kind: ''};
}

/* =================== hoja de Google (opcional) =================== */
function remoteURL(){
  if (CFG.datosURL) return CFG.datosURL;
  if (CFG.googleSheetId) return 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(CFG.googleSheetId) + '/gviz/tq?tqx=out:csv&headers=1&sheet=' + encodeURIComponent(CFG.googleSheetHoja || 'Carta');
  return '';
}
function parseCSV(text){
  var rows = [], row = [], f = '', q = false;
  for (var i = 0; i < text.length; i++){
    var c = text[i];
    if (q){ if (c === '"'){ if (text[i + 1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ','){ row.push(f); f = ''; }
    else if (c === '\n'){ row.push(f); rows.push(row); row = []; f = ''; }
    else if (c !== '\r') f += c;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function csvToRows(text){
  var t = parseCSV(String(text).replace(/^﻿/, '')); if (t.length < 2) return null;
  var head = t[0].map(function(h){ return norm(h).replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, ''); });
  if (head.indexOf('nombre') < 0 || head.indexOf('precio') < 0) return null;
  return t.slice(1).map(function(r){ var o = {}; head.forEach(function(h, j){ if (h) o[h] = r[j] == null ? '' : r[j]; }); return o; })
          .filter(function(o){ return String(o.nombre || '').trim(); });
}
function fetchRows(url, ms){
  var ctl = ('AbortController' in window) ? new AbortController() : null;
  var tm = setTimeout(function(){ if (ctl) ctl.abort(); }, ms || 8000);
  return fetch(url, {cache: 'no-store', signal: ctl ? ctl.signal : undefined})
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(txt){ clearTimeout(tm); var rows = csvToRows(txt); if (!rows || normalize(rows).length < 3) throw new Error('Formato no válido'); return rows; })
    .catch(function(e){ clearTimeout(tm); throw e; });
}
function applyRemote(rows, url){
  var sig = JSON.stringify(rows);
  state.checkedAt = Date.now(); state.source = 'hoja';
  store.set('lila.carta.cache', {url: url, t: state.checkedAt, rows: rows});
  if (sig === state.rowsSig){ renderFrescura(); return; }
  var anchor = scrollAnchor();
  if (setItems(rows)){ state.rowsSig = sig; renderAll(); restoreAnchor(anchor); }
}
function refreshRemote(){
  var url = remoteURL(); if (!url) return;
  fetchRows(url, 9000).then(function(rows){ applyRemote(rows, url); }).catch(function(e){ console.warn('[Lila] No se pudo leer la hoja:', e.message); renderFrescura(); });
}

/* =================== piezas de render =================== */
function archHTML(it, size, cls){
  var src = it.foto ? (size === 'f' ? it.foto.f : size === 'm' ? it.foto.m : it.foto.t) : '';
  return '<div class="arch' + (it.drink ? ' tall' : '') + (src ? '' : ' noimg') + (cls ? ' ' + cls : '') + '">' +
    (src ? '<img src="' + esc(src) + '" alt="" loading="lazy" decoding="async" onerror="this.parentNode.classList.add(\'noimg\');this.remove()">' : '') + '</div>';
}
function extrasTags(it){ return it.etiquetas.concat(it.opciones.filter(function(g){ return g.type === 'check' && g.choices[0].price; }).map(function(g){ return g.choices[0].label + ' +' + money(g.choices[0].price); })); }
function priceTxt(it){ return it.precio == null ? 'Consultar' : money(it.precio); }
function avBadge(a){
  if (!a.kind) return '';
  if (a.kind === 'hoy') return '<span class="c-av hoy">Hoy</span>';
  return '<span class="c-av ' + (a.kind === 'pedido' ? 'pedido' : '') + '">' + esc(a.label) + '</span>';
}
function cardHTML(it, extra){
  var a = avail(it), tags = extrasTags(it);
  return '<article class="item card' + (it.drink ? ' drink' : '') + (a.ok ? '' : ' off') + (extra ? ' ' + extra : '') + '" data-id="' + it.id + '">' +
    '<div class="c-ph">' + archHTML(it, 'm', 'frame') + avBadge(a) + '</div>' +
    '<div class="c-body"><h4 class="c-name"><button data-act="open" data-id="' + it.id + '">' + esc(it.nombre) + '</button></h4>' +
    (it.descripcion ? '<p class="c-desc">' + esc(it.descripcion) + '</p>' : '') +
    '<div class="c-foot"><span class="c-price">' + priceTxt(it) + '</span>' + (tags.length ? '<span class="c-tag">' + esc(tags.join(' · ')) + '</span>' : '') + '</div></div></article>';
}
function rowHTML(it, inGroup){

  var names = it.combina ? it.combina.split(',') : (CFG.combina[it.categoria] || CFG.combina[it.seccion] || []);
  var out = [];
  names.forEach(function(n){ n = norm(n); state.items.forEach(function(x){ if (norm(x.nombre) === n && x.id !== it.id && out.indexOf(x) < 0 && avail(x).ok) out.push(x); }); });
  return out.slice(0, 6);
}
function openDetail(id){
  var it = state.byId[id]; if (!it) return;
  var a = avail(it), sib = it._cat.items, pos = sib.indexOf(it);
  D = {it: it};
  var av = a.long ? '<div class="d-box ' + (a.ok ? '' : 'warn') + '">' + esc(a.long) + '</div>' : (a.kind === 'hoy' ? '<div class="d-box ok">' + esc('¡Hoy es su día! ' + (it.nota || '')) + '</div>' : '');
  var tags = extrasTags(it);
  var opts = it.opciones.map(function(g){
    return '<div class="d-box"><b>' + esc(g.name) + '</b> ' + esc(g.choices.map(function(c){ return c.label + (c.price ? ' (+' + money(c.price) + ')' : ''); }).join(' · ')) + '</div>';
  }).join('');
  var pairs = pairsFor(it);
  var body = '<div class="d-stage">' + (sib.length > 1 ? '<span class="d-pos">' + (pos + 1) + ' de ' + sib.length + ' · ' + esc(it.categoria) + '</span>' : '') +
    '<button class="d-nav" data-act="dgo" data-d="-1" aria-label="Plato anterior"' + (pos > 0 ? '' : ' disabled') + '>' + I.back + '</button>' +
    archHTML(it, 'f', 'd-win' + (it.drink ? ' tall' : '')) +
    '<button class="d-nav" data-act="dgo" data-d="1" aria-label="Plato siguiente"' + (pos < sib.length - 1 ? '' : ' disabled') + '>' + I.next + '</button></div>' +
    '<p class="d-cat">' + esc(it.grupo || it.categoria) + '</p><h3 class="d-name" id="sheetTitle">' + esc(it.nombre) + '</h3><p class="d-price">' + priceTxt(it) + '</p>' + av +
    (it.descripcion ? '<p class="d-desc">' + esc(it.descripcion) + '</p>' : '') +
    (tags.length ? '<div class="meta-tags">' + tags.map(function(t){ return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>' : '') +
    opts +
    (pairs.length ? '<div class="pair"><h4>Combínalo con</h4><div class="pair-row">' + pairs.map(function(p){ return '<button class="pair-card" data-act="open" data-id="' + p.id + '">' + archHTML(p, 't') + '<b>' + esc(p.nombre) + '</b><span>' + priceTxt(p) + '</span></button>'; }).join('') + '</div></div>' : '') +
    '';
  openSheet('detail', body, '');
  var stage = $('.d-stage'), x0 = null;
  stage.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive: true});
  stage.addEventListener('touchend', function(e){ if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 50) detailGo(dx < 0 ? 1 : -1); });
}
function detailGo(d){ if (!D) return; var sib = D.it._cat.items, n = sib.indexOf(D.it) + d; if (n >= 0 && n < sib.length) openDetail(sib[n].id); }
/* ---------- Información ---------- */
function toMin(s){ var m = String(s).trim().match(/^(\d{1,2}):?(\d{2})?$/); return m ? (+m[1]) * 60 + (+(m[2] || 0)) : 0; }
function openInfo(){
  var c = CFG, li = [];
  var hk = ['lunes','martes','miercoles','jueves','viernes','sabado','domingo'], hl = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
  if (hk.some(function(k){ return c.horario && c.horario[k]; })){
    li.push('<li>' + I.clock + '<div style="flex:1"><b>Horario</b><table class="hor">' + hk.map(function(k, i){ var v = String(c.horario[k] || '').trim(); var idx = (i + 1) % 7; return '<tr' + (idx === NOW.dow ? ' class="today"' : '') + '><td>' + hl[i] + '</td><td>' + (v ? esc(v.split(',').map(function(r){ var p = r.trim().split('-'); return p.length === 2 ? hhmm(toMin(p[0])) + ' – ' + hhmm(toMin(p[1])) : r; }).join(' · ')) : 'Cerrado') + '</td></tr>'; }).join('') + '</table></div></li>');
  }
  if (c.direccion) li.push('<li>' + I.pin + '<div><b>Dirección</b><small>' + esc(c.direccion) + '</small>' + (c.mapa ? '<small><a href="' + esc(c.mapa) + '" target="_blank" rel="noopener">Cómo llegar</a></small>' : '') + '</div></li>');
  if (c.wifi && c.wifi.red) li.push('<li>' + I.wifi + '<div><b>Wi-Fi</b><small>Red: ' + esc(c.wifi.red) + (c.wifi.clave ? '<br>Clave: ' + esc(c.wifi.clave) : '') + '</small></div>' + (c.wifi.clave ? '<button class="copy-btn" data-act="copy" data-text="' + esc(c.wifi.clave) + '">' + I.copy + 'Copiar</button>' : '') + '</li>');
  if (c.whatsapp) li.push('<li>' + I.wa + '<div><b>WhatsApp</b><small><a href="https://wa.me/' + esc(String(c.whatsapp).replace(/\D/g, '')) + '" target="_blank" rel="noopener">Escríbenos</a></small></div></li>');
  if (c.telefono) li.push('<li>' + I.phone + '<div><b>Teléfono</b><small><a href="tel:' + esc(String(c.telefono).replace(/[^\d+]/g, '')) + '">' + esc(c.telefono) + '</a></small></div></li>');
  if (c.instagram) li.push('<li>' + I.ig + '<div><b>Instagram</b><small><a href="https://instagram.com/' + esc(String(c.instagram).replace(/^@/, '')) + '" target="_blank" rel="noopener">@' + esc(String(c.instagram).replace(/^@/, '')) + '</a></small></div></li>');
  var body = '<div style="width:96px;margin:6px auto 0;color:var(--gold)"><svg viewBox="0 0 2382 2921" style="width:100%;height:auto"><use href="#logo-cover"/></svg></div>' +
    '<h3 class="sr" id="sheetTitle">Información</h3>' + (c.historia ? '<p class="historia">' + esc(c.historia) + '</p>' : '') +
    (li.length ? '<ul class="info-list">' + li.join('') + '</ul>' : '') + '<div class="d-box" style="margin-top:18px">' + esc(c.avisoAlergias || '') + '</div>';
  openSheet('info', body, '<button class="btn btn-ghost" style="width:100%" data-act="share">' + I.share + 'Compartir la carta</button>');
}

/* ---------- Toast ---------- */
var toastT = null;
function toast(msg, action, act){
  var t = $('#toast'); t.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button data-act="' + act + '">' + esc(action) + '</button>' : '');
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 2600);
}

/* ---------- Tema ---------- */
function setThemeIcon(){ var d = document.documentElement.getAttribute('data-theme') === 'dark'; var b = $('#themeBtn'); b.innerHTML = d ? I.sun : I.moon; b.setAttribute('aria-label', d ? 'Volver a los colores de día' : 'Modo noche'); var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = d ? '#1c1620' : '#faf6f0'; }

/* =================== eventos =================== */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el){ var art = e.target.closest('#menu .item'); if (art) openDetail(art.getAttribute('data-id')); return; }
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id');
  switch (act){
    case 'open': openDetail(id); break;
    case 'dgo': detailGo(+el.getAttribute('data-d')); break;
    case 'close': closeSheet(); break;
    case 'tab': spyLock = Date.now() + 900; setActiveTab(el.getAttribute('data-target')); goTo(document.getElementById(el.getAttribute('data-target'))); break;
    case 'view': { var a = scrollAnchor(); state.view = state.view === 'fotos' ? 'lista' : 'fotos'; store.set('lila.vista', state.view); renderMenu(); applyFilters(true); restoreAnchor(a); onScroll(); toast(state.view === 'fotos' ? 'Vista con fotos' : 'Vista de lista, como la carta impresa'); break; }
    case 'search': $('#nav').classList.add('searching'); setTimeout(function(){ $('#q').focus(); }, 30); if ($('#nav').getBoundingClientRect().top > 0) goTo($('#menu')); break;
    case 'search-close': $('#q').value = ''; state.q = ''; $('#nav').classList.remove('searching'); applyFilters(); break;
    case 'unexcl': state.excl = state.excl.filter(function(x){ return x !== el.getAttribute('data-code'); }); store.set('lila.filtros', {excl: state.excl}); applyFilters(); break;
    case 'unsolo': state.soloDisp = false; applyFilters(); break;
    case 'clear-all': state.excl = []; state.soloDisp = false; state.q = ''; $('#q').value = ''; $('#nav').classList.remove('searching'); store.set('lila.filtros', {excl: []}); applyFilters(); break;
    case 'info': openInfo(); break;
    case 'theme': { var d = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', d); try { localStorage.setItem('lila.tema2', d); } catch(err){} setThemeIcon(); break; }
    case 'share': { var url = location.origin + location.pathname, data = {title: (CFG.nombre || 'Lila') + ' · Carta', text: CFG.lema || '', url: url}; if (navigator.share) navigator.share(data).catch(function(){}); else copyText(url, 'Enlace copiado'); break; }
    case 'copy': copyText(el.getAttribute('data-text'), 'Clave copiada'); break;
    case 'story': openStory(+el.getAttribute('data-g')); break;
    case 'st-next': storyStep(1); break;
    case 'st-prev': storyStep(-1); break;
    case 'st-close': closeStory(); break;
    case 'st-open': { var sid = id; closeStory(); setTimeout(function(){ openDetail(sid); }, 80); break; }
    case 'st-again': if (ST){ ST.slides = [{combo: pickCombo()}]; ST.i = 0; renderStory(); } break;
  }
});
document.addEventListener('change', function(e){
  var el = e.target;
});
function copyText(t, msg){
  var done = function(){ toast(msg); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function(){ fallbackCopy(t); done(); });
  else { fallbackCopy(t); done(); }
}
function fallbackCopy(t){ var ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch(e){} ta.remove(); }
document.addEventListener('keydown', function(e){
  if (ST){ if (e.key === 'ArrowRight') storyStep(1); else if (e.key === 'ArrowLeft') storyStep(-1); else if (e.key === 'Escape') closeStory(); return; }
  if (sheetKind === 'detail' && (e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !/TEXTAREA|INPUT/.test(e.target.tagName)) detailGo(e.key === 'ArrowRight' ? 1 : -1);
  if (e.key === 'Escape'){ if (sheetKind) closeSheet(); else if ($('#nav').classList.contains('searching')) $('[data-act=search-close]').click(); }
});
/* Mantener presionada una historia la pausa */
(function(){
  var s = $('#story');
  s.addEventListener('pointerdown', function(e){ if (ST && !e.target.closest('button:not(.st-tap)')) ST.paused = true; });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ s.addEventListener(ev, function(){ if (ST) ST.paused = false; }); });
  var y0 = null;
  s.addEventListener('touchstart', function(e){ y0 = e.touches[0].clientY; }, {passive: true});
  s.addEventListener('touchend', function(e){ if (y0 != null && e.changedTouches[0].clientY - y0 > 90) closeStory(); y0 = null; });
})();
var qT = null;
$('#q').addEventListener('input', function(e){ clearTimeout(qT); qT = setTimeout(function(){ state.q = e.target.value.trim(); applyFilters(); if ($('#nav').getBoundingClientRect().top > 1) goTo($('#menu')); }, 120); });
$('#q').addEventListener('keydown', function(e){ if (e.key === 'Enter') e.target.blur(); });
var ticking = false, scrollEndT = null;
window.addEventListener('scroll', function(){ if (spyLock > Date.now()) spyLock = Date.now() + 400; clearTimeout(scrollEndT); scrollEndT = setTimeout(function(){ spyLock = 0; onScroll(); }, 140); if (!ticking){ ticking = true; requestAnimationFrame(function(){ ticking = false; onScroll(); }); } }, {passive: true});
window.addEventListener('resize', onScroll);
/* Arrastrar la hoja hacia abajo para cerrar */
(function(){
  var sh = $('#sheet'), y0 = null, dy = 0;
  function start(e){ var b = $('#sheetBody'); if (e.target.closest('.d-stage')) return; if (e.target.closest('#grab') || (b.scrollTop <= 0 && e.target.closest('.sheet-body'))){ y0 = e.touches[0].clientY; dy = 0; } }
  function move(e){ if (y0 == null) return; dy = e.touches[0].clientY - y0; if (dy > 0){ sh.style.transition = 'none'; sh.style.transform = 'translateY(' + dy + 'px)'; } }
  function end(){ if (y0 == null) return; sh.style.transition = ''; sh.style.transform = ''; if (dy > 110) closeSheet(); y0 = null; }
  sh.addEventListener('touchstart', start, {passive: true}); sh.addEventListener('touchmove', move, {passive: true}); sh.addEventListener('touchend', end);
})();

/* =================== arranque =================== */
function boot(){
  setThemeIcon();
  state.view = store.get('lila.vista', CFG.vistaInicial === 'lista' ? 'lista' : 'fotos') === 'lista' ? 'lista' : 'fotos';
  var f = store.get('lila.filtros', null); if (f && f.excl) state.excl = f.excl.filter(function(c){ return ALG[c]; });
  renderStatic(); renderEstado();
  var url = remoteURL(), cache = store.get('lila.carta.cache', null), rows = window.LILA_CARTA || [];
  state.source = 'local';
  if (url && cache && cache.url === url && cache.rows && normalize(cache.rows).length >= 3){ rows = cache.rows; state.source = 'cache'; state.checkedAt = cache.t; }
  var finish = function(){
    setItems(rows); state.rowsSig = state.source === 'local' ? '' : JSON.stringify(rows);
    renderAll(); $('#loader').classList.add('hide');
    if (url){
      if (state.source !== 'hoja') refreshRemote();
      var every = Math.max(1, +CFG.revisarCambiosCadaMin || 3) * 60000;
      setInterval(function(){ if (!document.hidden) refreshRemote(); }, every);
      document.addEventListener('visibilitychange', function(){ if (!document.hidden && Date.now() - state.checkedAt > 60000) refreshRemote(); });
    }
  };
  if (url && state.source === 'local'){
    $('#loader').classList.remove('hide');
    fetchRows(url, 2600).then(function(r){ rows = r; state.source = 'hoja'; state.checkedAt = Date.now(); store.set('lila.carta.cache', {url: url, t: state.checkedAt, rows: r}); })
      .catch(function(e){ console.warn('[Lila] Usando la carta de respaldo:', e.message); }).then(finish);
  } else finish();
  setInterval(function(){ var d = NOW.dow; NOW = nowParts(); renderEstado(); if (d !== NOW.dow) renderAll(); }, 60000);
}
boot();
})();

</script>
